<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>yuu · Profils de nageurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink: #ff66ab;
    --pink-dark: #e35b93;
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-dark: #46464f;
    --text: #454545;
    --text-light: #939393;
    --border: rgba(0, 0, 0, .08);
    --card: #f7f6f7;
    --blue: #1e90ff;
    --gold: #ffc84a;
  }
  html[data-theme="dark"] {
    --bg: #211f26;
    --panel: #2e2c34;
    --text: #d6d4db;
    --text-light: #908e99;
    --border: rgba(255, 255, 255, .09);
    --card: #26242b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Exo 2', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    padding: 110px 24px 70px;
    text-align: center;
    color: #fff;
    background:
      radial-gradient(1200px 500px at 15% -20%, rgba(30,144,255,.55), transparent 60%),
      radial-gradient(900px 420px at 85% 120%, rgba(255,102,171,.65), transparent 60%),
      linear-gradient(135deg, #232332 0%, #2b2140 55%, #40204a 100%);
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      -55deg,
      rgba(255,255,255,.05) 0 26px,
      transparent 26px 78px);
  }
  .hero-inner { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }
  .logo {
    font-size: 64px; font-weight: 900; letter-spacing: 2px; line-height: 1;
    text-shadow: 0 4px 18px rgba(0,0,0,.45);
  }
  .logo span { color: var(--pink); }
  .tagline {
    margin-top: 12px; font-size: 16px; font-weight: 500; opacity: .85;
    letter-spacing: .4px;
  }

  /* ---------- swimmers grid ---------- */
  .wrap { max-width: 1100px; margin: -35px auto 0; padding: 0 24px 70px; position: relative; z-index: 2; }
  .section-label {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 14px;
  }
  .section-label h2 { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: .3px; }
  .section-label span { font-size: 12px; color: var(--text-light); font-weight: 500; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  a.swimmer-card {
    display: block; text-decoration: none; color: inherit;
    background: var(--panel); border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.09);
    padding: 20px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.swimmer-card:hover { transform: translateY(-4px); box-shadow: 0 12px 26px rgba(0,0,0,.16); }
  .sc-head { display: flex; align-items: center; gap: 14px; }
  .sc-avatar {
    width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
    padding: 3px;
    background: linear-gradient(140deg, var(--blue), var(--pink));
    display: flex; align-items: center; justify-content: center;
  }
  .sc-avatar div {
    width: 100%; height: 100%; border-radius: 50%;
    background: #23232e; border: 2px solid rgba(255,255,255,.85);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 800; color: #fff; letter-spacing: 1px;
  }
  .sc-name { font-size: 16.5px; font-weight: 800; letter-spacing: .3px; line-height: 1.2; }
  .sc-born { font-size: 11.5px; color: var(--text-light); font-weight: 600; margin-top: 2px; }
  .sc-club {
    margin-top: 12px; font-size: 12px; color: var(--text-light); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sc-foot {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .sc-stat b { font-size: 19px; font-weight: 800; }
  .sc-stat span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--text-light); font-weight: 700; display: block; }
  .sc-open {
    font-size: 11.5px; font-weight: 800; color: var(--pink); letter-spacing: .4px;
    white-space: nowrap;
  }

  .loading, .error-msg {
    max-width: 560px; margin: 0 auto; background: var(--panel);
    border-radius: 10px; padding: 26px; text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.09);
    color: var(--text-light); font-size: 13.5px; font-weight: 500;
  }
  .error-msg a { color: var(--pink); font-weight: 700; text-decoration: none; }

  footer { text-align: center; color: var(--text-light); font-size: 12px; padding: 0 24px 40px; font-weight: 500; }
  footer a { color: var(--pink); text-decoration: none; }

  /* ---------- theme toggle ---------- */
  #theme-toggle {
    position: fixed; top: 18px; right: 22px; z-index: 50;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(15,15,22,.45);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: transform .12s ease, background .15s ease;
  }
  #theme-toggle:hover { transform: scale(1.08); background: rgba(15,15,22,.65); }
  #theme-toggle svg { display: none; }
  html[data-theme="light"] #theme-toggle .icon-moon { display: block; }
  html[data-theme="dark"] #theme-toggle .icon-sun { display: block; }

  @media (max-width: 720px) {
    .hero { padding: 80px 20px 60px; }
    .logo { font-size: 48px; }
    .wrap { padding: 0 20px 50px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    a.swimmer-card { padding: 16px; }
    .sc-name { font-size: 15px; }
    .sc-stat b { font-size: 16px; }
  }
</style>
<script>
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
})();
</script>
</head>
<body>

<button id="theme-toggle" aria-label="Basculer le thème clair/sombre">
  <svg class="icon-moon" viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<header class="hero">
  <div class="hero-inner">
    <div class="logo">yuu<span>.</span></div>
    <p class="tagline">Profils de nageurs · données FFN</p>
  </div>
</header>

<main class="wrap">
  <div class="section-label">
    <h2>Nageurs</h2>
    <span id="count-note">chargement…</span>
  </div>
  <div class="grid" id="swimmers"></div>
  <noscript><p class="error-msg" style="margin-top:16px">Activez JavaScript pour voir la liste des nageurs.</p></noscript>
</main>

<footer>données · <a href="./data/performances.json">performances.json</a></footer>

<script>
const GRID = document.getElementById('swimmers');
const COUNT = document.getElementById('count-note');
const initialsOf = name => name.split(/\s+/).map(s => s[0]).slice(-2).join('').toUpperCase();
const secOf = t => { const m = t.match(/^(?:(\d+):)?(\d{1,2}):(\d{2}(?:\.\d+)?)$/); return m ? (+m[1]||0)*3600+(+m[2])*60+parseFloat(m[3]) : parseFloat(t)||0; };

fetch('./data/performances.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    const entries = Array.isArray(data) ? data : [data];
    COUNT.textContent = entries.length + ' nageur' + (entries.length > 1 ? 's' : '');
    GRID.innerHTML = entries.map(e => {
      const p = e.person || {};
      const perfs = Array.isArray(e.performances) ? e.performances : [];
      const best = perfs.reduce((m, x) => Math.max(m, parseInt(x.points) || 0), 0);
      const born = (p.ind.match(/\((\d{4})\)/) || [])[1];
      const iuf = p.iuf != null ? p.iuf : '';
      return `
      <a class="swimmer-card" href="./profile.html#${iuf}">
        <div class="sc-head">
          <div class="sc-avatar"><div>${initialsOf(p.ind || '?')}</div></div>
          <div style="min-width:0">
            <div class="sc-name">${(p.ind || 'Nageur').split(' (')[0]}</div>
            ${born ? `<div class="sc-born">né en ${born}</div>` : ''}
          </div>
        </div>
        <div class="sc-club">${p.clb || ''}</div>
        <div class="sc-foot">
          <div class="sc-stat"><b>${perfs.length}</b><span>résultats</span></div>
          <div class="sc-stat"><b>${best}</b><span>meilleur pts</span></div>
          <span class="sc-open">Voir →</span>
        </div>
      </a>`;
    }).join('');
  })
  .catch(() => {
    COUNT.textContent = '';
    GRID.innerHTML = `<p class="error-msg" style="grid-column:1/-1">Impossible de charger les données.<br/>
    Lance le serveur (<code>npx vite</code>) puis ouvre cette page via HTTP.<br/><br/>
    <a href="/profile.html">Ouvrir le profil directement →</a></p>`;
  });

document.getElementById('theme-toggle').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch (e) {}
});
</script>
</body>
</html>
